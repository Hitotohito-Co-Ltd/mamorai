<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>シフト希望</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A5F}a:hover{color:#0F2440}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F9; font-family: 'Noto Sans JP', system-ui, sans-serif; color: #1F2937; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
  <header style="background: #1E3A5F; color: #FFFFFF; padding: 18px 20px 16px; display: flex; justify-content: space-between; align-items: flex-end">
    <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #A7F3D0; letter-spacing: 0.04em">MAMOR-AI 勤務員アプリ</span><span style="font-size: 22px; font-weight: 700">シフト希望</span></span>
    <span style="font-size: 13px; color: #D6DEE8">提出期限 11/5（木）</span>
  </header>
  <main style="flex: 1; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="前の月" style="width: 44px; height: 44px; border: 0; background: transparent; font: inherit; font-size: 20px; color: #1E3A5F">‹</button>
      <span style="font-size: 18px; font-weight: 700; color: #111827">2026年 11月</span>
      <button type="button" aria-label="次の月" style="width: 44px; height: 44px; border: 0; background: transparent; font: inherit; font-size: 20px; color: #1E3A5F">›</button>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px">
      <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background: #D1FAE5; color: #065F46; font-weight: 700">可 勤務可</span>
      <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background: #1E3A5F; color: #FFFFFF; font-weight: 700">夜 夜勤希望</span>
      <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background: #FFEDD5; color: #9A3412; font-weight: 700">休 休み希望</span>
      <span style="color: #4B5563; align-self: center">日付をタップで切替</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; text-align: center">
      <span style="color: #B91C1C; font-weight: 500">日</span><span style="color: #4B5563">月</span><span style="color: #4B5563">火</span><span style="color: #4B5563">水</span><span style="color: #4B5563">木</span><span style="color: #4B5563">金</span><span style="color: #1D4ED8; font-weight: 500">土</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="30">
        <button type="button" onClick="{{d.tap}}" aria-label="{{d.aria}}" style="height: 52px; border-radius: 8px; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0; {{d.box}}">
          <span style="font-size: 12px; {{d.numStyle}}">{{d.n}}</span>
          <span style="font-size: 13px; font-weight: 700; min-height: 18px">{{d.mark}}</span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 10px; padding: 10px 14px; font-size: 13px">
      <span>勤務可 <strong style="color: #065F46">{{cAvail}}</strong></span><span>夜勤 <strong style="color: #1E3A5F">{{cNight}}</strong></span><span>休み <strong style="color: #9A3412">{{cOff}}</strong></span><span style="color: #4B5563">未入力 {{cNone}}</span>
    </div>
    <label for="memo" style="font-size: 13px; font-weight: 500; color: #374151">備考（任意）</label>
    <input id="memo" value="11/12 は通院のため午前不可" style="height: 44px; box-sizing: border-box; border: 1px solid #CBD5E1; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 14px; background: #FFFFFF">
    <a href="#" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; background: #1E3A5F; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; margin-top: auto">この内容で提出する</a>
  </main>
  <nav aria-label="アプリのメニュー" style="display: grid; grid-template-columns: repeat(5, 1fr); background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 6px 4px 14px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" aria-current="{{t.cur}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; font-size: 11px; {{t.style}}">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="{{t.d}}" fill="none" stroke="{{t.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const init = {};
    [2, 3, 4, 5, 9, 10, 11, 16, 17, 18, 19, 24, 25, 26].forEach((n) => { init[n] = 'a'; });
    [6, 13, 20, 27].forEach((n) => { init[n] = 'n'; });
    [1, 8, 12, 15, 22, 29].forEach((n) => { init[n] = 'o'; });
    this.state = { v: init };
  }
  renderVals() {
    const v = (this.state && this.state.v) || {};
    const next = { '': 'a', a: 'n', n: 'o', o: '' };
    const M = {
      '': { mark: '', box: 'background:#FFFFFF;border:1px solid #E2E8F0;color:#1F2937', name: '未入力' },
      a: { mark: '可', box: 'background:#D1FAE5;border:1px solid #6EE7B7;color:#065F46', name: '勤務可' },
      n: { mark: '夜', box: 'background:#1E3A5F;border:1px solid #1E3A5F;color:#FFFFFF', name: '夜勤希望' },
      o: { mark: '休', box: 'background:#FFEDD5;border:1px solid #FDBA74;color:#9A3412', name: '休み希望' }
    };
    const days = [];
    for (let n = 1; n <= 30; n++) {
      const k = v[n] || '';
      const dow = (n - 1) % 7;
      days.push({
        n: n, mark: M[k].mark, box: M[k].box,
        numStyle: k === 'n' ? 'color:#FFFFFF' : (dow === 0 ? 'color:#B91C1C' : (dow === 6 ? 'color:#1D4ED8' : 'color:#374151')),
        aria: '11月' + n + '日 ' + M[k].name,
        tap: () => { const nv = Object.assign({}, v); nv[n] = next[k]; this.setState({ v: nv }); }
      });
    }
    const count = (k) => days.filter((d, i) => (v[i + 1] || '') === k).length;
    const tabs = [
      { label: '上番報告', href: 'App-Sites.dc.html', d: 'M12 2L20 5V11C20 16.5 16.5 20.5 12 22C7.5 20.5 4 16.5 4 11V5Z M8.5 12L11 14.5L15.5 9.5' },
      { label: 'シフト希望', href: 'App-Shift.dc.html', d: 'M5 5H19A1.5 1.5 0 0 1 20.5 6.5V18.5A1.5 1.5 0 0 1 19 20H5A1.5 1.5 0 0 1 3.5 18.5V6.5A1.5 1.5 0 0 1 5 5Z M3.5 10H20.5 M8 3V7 M16 3V7', on: true },
      { label: '有給申請', href: 'App-Leave.dc.html', d: 'M6 3H14L19 8V21H6Z M9 13H16 M9 17H14' },
      { label: '講習会', href: 'App-Training.dc.html', d: 'M3 9L12 4L21 9L12 14Z M7 11.5V16C9.5 18 14.5 18 17 16V11.5' },
      { label: 'お知らせ', href: 'App-Notice.dc.html', d: 'M6 16V11C6 7.5 8.5 5 12 5C15.5 5 18 7.5 18 11V16L20 18H4Z M10 20.5H14' }
    ].map((t) => Object.assign({}, t, {
      cur: t.on ? 'page' : 'false',
      color: t.on ? '#1E3A5F' : '#4B5563',
      style: t.on ? 'color:#1E3A5F;font-weight:700' : 'color:#4B5563'
    }));
    return { days: days, tabs: tabs, cAvail: count('a'), cNight: count('n'), cOff: count('o'), cNone: count('') };
  }
}
</script>
</body>
</html>
