<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>報告 出発 上番 下番 その他</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A5F}a:hover{color:#0F2440}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F9; font-family: 'Noto Sans JP', system-ui, sans-serif; color: #1F2937; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; position: relative; overflow: hidden">
  <header style="background: #1E3A5F; color: #FFFFFF; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 6px">
    <a href="App-Sites.dc.html" style="color: #A7F3D0; font-size: 13px; text-decoration: none; align-self: flex-start; padding: 4px 0">← 現場一覧</a>
    <span style="font-size: 22px; font-weight: 700">コーチャンフォー若葉台店</span>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #D6DEE8">
      <span>10/31（土） 早番 8:15〜15:00</span>
      <span style="color: #A7F3D0">● オンライン</span>
    </div>
  </header>
  <main style="flex: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
    <ol aria-label="本日の報告" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
      <li style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 12px; padding: 10px 4px">
        <span style="font-size: 12px; color: #065F46; font-weight: 500">出発</span>
        <span style="font-size: 16px; font-weight: 700; color: #065F46">06:24 済</span>
      </li>
      <li style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: #FFFFFF; border: 2px solid #1E3A5F; border-radius: 12px; padding: 9px 4px">
        <span style="font-size: 12px; color: #1E3A5F; font-weight: 500">上番</span>
        <span style="font-size: 16px; font-weight: 700; color: #1E3A5F">期限 8:15</span>
      </li>
      <li style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 4px">
        <span style="font-size: 12px; color: #4B5563; font-weight: 500">下番</span>
        <span style="font-size: 16px; font-weight: 700; color: #4B5563">15:00 以降</span>
      </li>
    </ol>

    <button type="button" onClick="{{ask}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 210px; border: 0; border-radius: 20px; background: #1E3A5F; color: #FFFFFF; font: inherit; cursor: pointer; box-shadow: 0 6px 16px rgba(30,58,95,0.25)">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 4L37 9.5V21C37 30 30.5 37 22 40C13.5 37 7 30 7 21V9.5Z" fill="none" stroke="#10B981" stroke-width="2.5"></path><path d="M15 22L20 27L29.5 17" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="font-size: 32px; font-weight: 700; letter-spacing: 0.06em">上番（出勤）</span>
      <span style="font-size: 15px; color: #D6DEE8">期限 8:15 ｜ 現在 7:52</span>
    </button>

    <button type="button" disabled style="height: 56px; border-radius: 14px; border: 1px solid #CBD5E1; background: #F1F5F9; color: #4B5563; font: inherit; font-size: 16px; font-weight: 700">下番（退勤）｜ 上番後に押せます</button>

    <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border-radius: 14px; border: 2px solid #C2410C; background: #FFFFFF; color: #9A3412; font-size: 17px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#C2410C" stroke-width="2"></circle><path d="M12 7V12.5L15.5 14.5" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round"></path></svg>
      その他（遅刻・寝坊・欠勤など）
    </a>
    <p style="margin: auto 0 0; font-size: 13px; line-height: 1.7; color: #4B5563; text-align: center">電波がない場所でも押せます。<br>つながった時点で自動で送信します。</p>
  </main>

  <sc-if value="{{asking}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: flex-end">
      <section aria-label="報告の確認" style="width: 100%; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 28px 20px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
        <span style="font-size: 14px; color: #4B5563; text-align: center">コーチャンフォー若葉台店 ｜ 笠井 さん</span>
        <span style="font-size: 24px; font-weight: 700; color: #111827; text-align: center">上番を報告しますか？</span>
        <a href="App-Done.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 14px; background: #047857; color: #FFFFFF; font-size: 20px; font-weight: 700; text-decoration: none">はい、報告する</a>
        <button type="button" onClick="{{cancel}}" style="height: 52px; border-radius: 14px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #1F2937; font: inherit; font-size: 16px">いいえ</button>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { asking: false };
  }
  renderVals() {
    return {
      asking: !!(this.state && this.state.asking),
      ask: () => this.setState({ asking: true }),
      cancel: () => this.setState({ asking: false })
    };
  }
}
</script>
</body>
</html>
