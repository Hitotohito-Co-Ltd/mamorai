<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>現場スマホ 報告者を選択</title>
<script src="./dc-shim.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A5F}a:hover{color:#0F2440}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F9; font-family: 'Noto Sans JP', system-ui, sans-serif; color: #1F2937; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
  <header style="background: #1E3A5F; color: #FFFFFF; padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 12px; color: #A7F3D0; letter-spacing: 0.04em">MAMOR-AI 上番報告</span>
      <span style="font-size: 12px; font-weight: 700; color: #1E3A5F; background: #A7F3D0; border-radius: 999px; padding: 3px 10px">現場スマホ（共用）</span>
    </div>
    <span style="font-size: 22px; font-weight: 700">ららぽーと立川立飛</span>
    <span style="font-size: 13px; color: #D6DEE8">10/30（金） 交通 ｜ 現在 7:52</span>
  </header>
  <main style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 20px; color: #111827">自分の名前を選んでください</h1>
    <p style="margin: 0; font-size: 14px; color: #4B5563">選んだあと、スタッフNoで本人確認します</p>

    <a href="Phone-Confirm.html" style="display: flex; align-items: center; gap: 14px; min-height: 96px; box-sizing: border-box; padding: 16px; background: #FFFFFF; border: 2px solid #DC2626; border-radius: 16px; text-decoration: none; color: #111827">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 26px; font-weight: 700">佐藤</span>
        <span style="font-size: 14px; color: #374151">日勤1（荷捌） 8:00〜17:00</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <span style="font-size: 13px; font-weight: 700; color: #991B1B; background: #FEE2E2; border-radius: 999px; padding: 4px 10px">上番 未連絡</span>
        <span style="font-size: 13px; color: #991B1B">締切 7:45 超過</span>
      </div>
    </a>

    <a href="Phone-Confirm.html" style="display: flex; align-items: center; gap: 14px; min-height: 96px; box-sizing: border-box; padding: 16px; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 16px; text-decoration: none; color: #111827">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 26px; font-weight: 700">鈴木</span>
        <span style="font-size: 14px; color: rgb(55, 65, 81)">日勤2（隊長） 9:30〜18:30</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
        <span style="font-size: 13px; font-weight: 700; color: #334155; background: #F1F5F9; border-radius: 999px; padding: 4px 10px">上番 締切前</span>
        <span style="font-size: 13px; color: #4B5563">締切 9:15</span>
      </div>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 16px; padding: 16px">
      <label for="sno2" style="font-size: 15px; font-weight: 700; color: #111827">本人確認：スタッフNo</label>
      <div style="display: flex; gap: 8px">
        <input id="sno2" type="text" inputmode="numeric" autocomplete="off" placeholder="スタッフNo" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; border: 2px solid #1E3A5F; border-radius: 12px; padding: 0 14px; font: inherit; font-size: 24px; font-weight: 700; letter-spacing: 0.15em">
        <a href="Phone-Confirm.html" style="width: 88px; height: 56px; border-radius: 12px; background: #1E3A5F; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">確認</a>
      </div>
      <span style="font-size: 13px; color: #4B5563">リストにない交代要員も、スタッフNoで報告できます</span>
    </div>

    <p style="margin: auto 0 0; font-size: 13px; line-height: 1.7; color: #4B5563; text-align: center">共用端末のため本人登録はしません。<br>報告のたびにスタッフNoを入力してください。</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
